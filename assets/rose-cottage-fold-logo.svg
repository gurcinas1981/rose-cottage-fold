<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Rose Cottage Fold — North Muskham</title>
  <defs>
    <style>
      .red{fill:#C8A96A;stroke:#3B0813;stroke-width:4;stroke-linejoin:round}
      .brass{fill:#E3CC9A}
      .bl{fill:none;stroke:#E3CC9A;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
      .wm{font-family:Georgia,'Times New Roman',serif;fill:#C8A96A;font-size:72px;letter-spacing:2px}
      .sub{font-family:Georgia,'Times New Roman',serif;fill:#E3CC9A;font-size:21px;letter-spacing:8px}
    </style>
    <!-- one outer petal, pointing up from origin -->
    <path id="petal" class="red" d="M0,0 C-40,-18 -62,-58 -44,-98 C-22,-118 22,-118 44,-98 C62,-58 40,-18 0,0 Z"/>
  </defs>

  <!-- Gable and posts -->
  <g transform="translate(400,0)">
    <path class="brass" d="M-190,222 L0,50 L190,222 L166,222 L0,84 L-166,222 Z"/>
    <rect class="brass" x="-158" y="236" width="22" height="110"/>
    <rect class="brass" x="136" y="236" width="22" height="110"/>
  </g>

  <!-- Rose -->
  <g transform="translate(400,262)">
    <!-- five outer petals -->
    <use href="#petal" transform="rotate(0)"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
    <!-- inner ring of petals, offset -->
    <g transform="rotate(36) scale(0.62)">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
    <!-- centre -->
    <circle cx="0" cy="0" r="13" fill="#9A6A3A"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <!-- stem and leaves -->
    <path class="bl" d="M0,100 L0,126"/>
    <path class="brass" d="M0,126 C-28,112 -60,118 -94,150 C-60,152 -28,142 0,130 Z"/>
    <path class="brass" d="M0,126 C28,112 60,118 94,150 C60,152 28,142 0,130 Z"/>
  </g>

  <!-- Wordmark -->
  <text class="wm" x="400" y="486" text-anchor="middle">Rose Cottage Fold</text>

  <!-- Location strapline -->
  <line x1="150" y1="532" x2="232" y2="532" stroke="#9A6A3A" stroke-width="2"/>
  <text class="sub" x="404" y="540" text-anchor="middle">NORTH MUSKHAM</text>
  <line x1="568" y1="532" x2="650" y2="532" stroke="#9A6A3A" stroke-width="2"/>
</svg>
