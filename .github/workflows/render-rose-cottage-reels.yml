name: Render Rose Cottage Reels

on:
  workflow_dispatch:
  push:
    paths:
      - 'social/reels/**'
      - '.github/workflows/render-rose-cottage-reels.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core
      - name: Render 12 vertical reels
        run: python3 social/reels/render_reels.py
      - name: Upload reels
        uses: actions/upload-artifact@v4
        with:
          name: rose-cottage-fold-12-reels
          path: social/reels/output/
          if-no-files-found: error
          retention-days: 30
